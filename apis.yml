name: Kaodim
description: Kaodim was a Southeast Asian on-demand home and local services marketplace founded in
  2014 that connected consumers with service providers such as cleaners, plumbers, electricians,
  aircon technicians, movers, tutors, and event professionals. Headquartered in Malaysia, it operated
  regionally under Kaodim.com (Malaysia), Kaodim.sg (Singapore), Gawin.ph (Philippines), and Beres.id
  (Indonesia), and raised venture funding from investors including 500 Global (500 Startups), Venturra
  Capital, and Square Peg. The company ceased all operations on July 1, 2022, citing prolonged COVID-19
  lockdowns, labor shortages, rising costs, and weakened demand. This profile was surfaced as a 500
  Global portfolio company and added to the API Evangelist network; no public developer program or API
  surface exists for the defunct company, so there are no API artifacts to enrich.
